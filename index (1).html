<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Clipper</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#111;color:#eee}
h1{font-size:22px}label{display:block;margin:12px 0 4px;font-size:14px;color:#aaa}
input,select,button{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box}
button{background:#4f46e5;border:0;margin-top:16px;font-weight:600}button:disabled{opacity:.5}
#st{margin:14px 0;color:#9ae6b4;white-space:pre-wrap}.clip{margin:16px 0;padding:10px;background:#1b1b1b;border-radius:8px}
video{width:100%;border-radius:8px}a{color:#8ab4ff;display:block;margin-top:8px}.row{display:flex;gap:8px}.row>div{flex:1}
</style></head><body>
<h1>My Clipper</h1>
<p style="color:#aaa;font-size:14px">Everything runs on your phone. Nothing is uploaded. Short videos (under ~10 min) work best.</p>
<label>Video from your phone</label><input type="file" id="f" accept="video/*">
<label>...or paste a direct video link (.mp4)</label><input type="url" id="u" placeholder="https://example.com/video.mp4">
<div class="row"><div><label>Language</label><select id="lang"><option value="">Auto</option><option value="hindi">Hindi</option><option value="english">English</option></select></div>
<div><label>Accuracy</label><select id="model"><option value="Xenova/whisper-tiny">Fast (tiny)</option><option value="Xenova/whisper-base" selected>Normal (base)</option><option value="Xenova/whisper-small">Best (small, slow)</option></select></div></div>
<div class="row"><div><label>Clips</label><input type="number" id="n" value="3" min="1" max="10"></div>
<div><label>Seconds each</label><input type="number" id="len" value="40" min="10" max="120"></div></div>
<label>Format</label><select id="fmt"><option value="v">Vertical 9:16 (Shorts/Reels)</option><option value="h">Horizontal 16:9</option></select>
<label>Gemini key (optional, picks best moments)</label><input type="password" id="key" placeholder="leave empty for even spacing">
<button id="go">Make clips</button>
<div id="st"></div><div id="out"></div>
<video id="v" playsinline style="display:none"></video>
<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2";
const $ = id => document.getElementById(id), st = m => $("st").textContent = m;
const v = $("v");
let actx, dest, srcNode;

async function decode(file) {
  const buf = await file.arrayBuffer();
  const c = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const a = await c.decodeAudioData(buf); c.close();
  return a.getChannelData(0);
}

async function pickGemini(segs, key, n, len) {
  const t = segs.map(s => `[${s.s.toFixed(1)}-${s.e.toFixed(1)}] ${s.t}`).join("\n");
  const p = `Pick the ${n} most engaging self-contained moments for short clips, each about ${len} seconds, starting and ending at sentence boundaries. Return ONLY JSON like [{"start":12.0,"end":55.0}].\n\n${t}`;
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts: [{ text: p }] }], generationConfig: { responseMimeType: "application/json" } }) });
  if (!r.ok) throw new Error("Gemini " + r.status);
  return JSON.parse((await r.json()).candidates[0].content.parts[0].text);
}

function pickEven(segs, n, len, dur) {
  const out = [], step = Math.max(len, (dur - len) / Math.max(1, n));
  for (let i = 0; i < n; i++) {
    const a0 = i * step; if (a0 >= dur) break;
    const first = segs.find(s => s.s >= a0) || segs[segs.length - 1];
    const a = first.s; let b = a;
    for (const s of segs) if (s.s >= a && s.e - a <= len + 8) b = s.e;
    if (b - a > 3) out.push({ start: a, end: b });
  }
  return out;
}

function wrap(ctx, text, maxW) {
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

async function render(a, b, segs, vertical) {
  const W = vertical ? 720 : 1280, H = vertical ? 1280 : 720;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const fs = Math.round(W * (vertical ? 0.07 : 0.04));
  const stream = cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 3e6 } : {});
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  v.currentTime = a; await new Promise(r => v.onseeked = r);
  const done = new Promise(r => rec.onstop = r);
  rec.start(); await v.play();
  await new Promise(res => {
    const draw = () => {
      const t = v.currentTime;
      if (t >= b || v.ended) return res();
      const vw = v.videoWidth, vh = v.videoHeight, s = Math.max(W / vw, H / vh);
      ctx.drawImage(v, (vw - W / s) / 2, (vh - H / s) / 2, W / s, H / s, 0, 0, W, H);
      const seg = segs.find(x => t >= x.s && t < x.e);
      if (seg) {
        ctx.font = `bold ${fs}px sans-serif`; ctx.textAlign = "center";
        ctx.lineWidth = fs / 5; ctx.strokeStyle = "#000"; ctx.fillStyle = "#fff"; ctx.lineJoin = "round";
        const lines = wrap(ctx, seg.t, W * 0.9);
        lines.forEach((l, i) => { const y = H - H * 0.12 - (lines.length - 1 - i) * fs * 1.2;
          ctx.strokeText(l, W / 2, y); ctx.fillText(l, W / 2, y); });
      }
      requestAnimationFrame(draw);
    };
    draw();
  });
  v.pause(); rec.stop(); await done;
  return { blob: new Blob(chunks, { type: rec.mimeType }), ext: rec.mimeType.includes("mp4") ? "mp4" : "webm" };
}

$("go").onclick = async () => {
  let file = $("f").files[0]; const link = $("u").value.trim();
  if (!file && !link) return st("Choose a video or paste a direct video link.");
  $("go").disabled = true; $("out").innerHTML = "";
  try {
    if (!file) {
      st("Downloading video from the link...");
      let r;
      try { r = await fetch(link); }
      catch (e) { throw new Error("This link doesn't allow downloads from a website. YouTube, Google Drive, Instagram and similar links don't work. Use a direct .mp4 link, or choose the file."); }
      if (!r.ok) throw new Error("Link failed with code " + r.status);
      file = await r.blob();
    }
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); await actx.resume();
    v.src = URL.createObjectURL(file); v.style.display = "none";
    await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error("Cannot open this video")); });
    if (!srcNode) { srcNode = actx.createMediaElementSource(v); dest = actx.createMediaStreamDestination(); srcNode.connect(dest); }
    st("Reading audio...");
    const audio = await decode(file), dur = audio.length / 16000;
    st("Loading speech model (first time downloads 40-250 MB)...");
    const asr = await pipeline("automatic-speech-recognition", $("model").value, {
      dtype: "q8", device: "wasm",
      progress_callback: p => p.status === "progress" && st(`Downloading model ${Math.round(p.progress)}%`) });
    st("Transcribing... this can take a few minutes. Keep the screen on.");
    const lang = $("lang").value;
    const res = await asr(audio, { return_timestamps: true, chunk_length_s: 30, stride_length_s: 5, task: "transcribe", ...(lang ? { language: lang } : {}) });
    const segs = res.chunks.map(c => ({ s: c.timestamp[0], e: c.timestamp[1] ?? Math.min(dur, c.timestamp[0] + 4), t: c.text.trim() })).filter(x => x.t);
    if (!segs.length) throw new Error("No speech found");
    const n = +$("n").value, len = +$("len").value;
    let picks; const key = $("key").value.trim();
    try { if (!key) throw 0; st("Picking best moments..."); picks = await pickGemini(segs, key, n, len); }
    catch (e) { picks = pickEven(segs, n, len, dur); }
    for (let i = 0; i < picks.length; i++) {
      const a = +picks[i].start, b = Math.min(+picks[i].end, dur);
      st(`Rendering clip ${i + 1} of ${picks.length} (takes about ${Math.round(b - a)} s). Keep this tab open.`);
      const { blob, ext } = await render(a, b, segs, $("fmt").value === "v");
      const url = URL.createObjectURL(blob), d = document.createElement("div"); d.className = "clip";
      d.innerHTML = `<video controls playsinline src="${url}"></video><a download="clip${i + 1}.${ext}" href="${url}">Download clip ${i + 1}</a>`;
      $("out").appendChild(d);
    }
    st("Done. Download your clips below.");
  } catch (e) { st("Error: " + (e.message || e)); }
  $("go").disabled = false;
};
</script></body></html>
